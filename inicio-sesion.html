<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Inicio de Sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>
<body class="publico">

    <header class="cabezera-principal">
        <a href="pagina-principal.html" class="logo">
            <span class="icono-cuadrado">■</span>
            <strong>Veterinaria San Marcos</strong>
        </a>
        <nav class="nav-principal">
            <a href="pagina-principal.html">Home</a> |
            <a href="productos.html">Productos</a> |
            <a href="blogs.html">Blogs</a> |
            <a href="contacto.html">Contacto</a> |
            <a href="registro-usuario.html">Registrarse</a>
        </nav>
        <aside class="icono-carrito">
            <a href="carrito.html">🛒 Carrito (0)</a>
        </aside>
    </header>

    <main>
        <section id="inicio-sesion">
            <figure class="logo-veterinaria">
                <img src="img/logo_veterinaria.png" alt="Logo San Marcos" class="logo-img">
            </figure>

            <h1 class="titulo-form">Veterinaria San Marcos</h1>

            <h2 class="subtitulo-form">Inicio de sesión</h2>

            <form id="formulario-inicio" novalidate>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Iniciar sesión</button>
                <p id="mensaje-estado"></p>
            </form>
        </section>
    </main>
    <footer class="pie-pagina">
        <p>&copy; 2026 Veterinaria San Marco. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
