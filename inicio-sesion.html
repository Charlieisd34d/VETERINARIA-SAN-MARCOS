<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Inicio de Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <script src="funciones.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="square-icon">■</span>
            <strong>Veterinaria San Marcos</strong>
        </div>
        <nav class="nav-links">
            <a href="pagina-principal.html">Home</a> |
            <a href="productos.html">Productos</a> |
            <a href="blogs.html">Blogs</a> |
            <a href="contacto.html">Contacto</a> |
            <a href="registro-usuario.html">Registrarse</a>
        </nav>
        <div class="cart">
            <a href="carrito.html" style="text-decoration: none; color: inherit;">🛒 Carrito (0)</a>
        </div>
    </header>

    <main class="login-container">
        
        <div class="company-logo-placeholder">
            <div class="x-box"></div>
        </div>

        <h1 class="company-title">Veterinaria San Marcos</h1>

        <div class="login-card">
            <div class="login-header">Inicio de sesión</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-login">Iniciar sesión</button>
                </div>
            </form>
        </div>

    </main>
</body>
</html>
