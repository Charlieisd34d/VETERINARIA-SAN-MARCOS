            <a class="perfil" href="perfil.html">

    <main class="principal">

        <header class="cabecera">
            <h1 class="titulo">Registro de Usuario</h1>
        </header>

        <form class="tarjeta-formulario" id="formulario-usuario">

            <label for="run" class="etiqueta">Run</label>
            <input type="text" id="run" name="run" class="campo" minlength="7" maxlength="9" pattern="[0-9]{6,8}[0-9Kk]"
                placeholder="Ej: 19011022K" required>

            <label for="nombre" class="etiqueta">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="campo" maxlength="50" required>

            <label for="apellidos" class="etiqueta">Apellidos</label>
            <input type="text" class="campo" id="apellidos" name="apellidos" maxlength="100" required>

            <label for="correo" class="etiqueta">Correo</label>
            <input type="email" id="correo" name="correo" class="campo" maxlength="100"
                pattern="[A-Za-z0-9._%+-]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)" placeholder="ejemplo@duoc.cl"
                required>

            <label for="fecha-nacimiento" class="etiqueta"></label>
            <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" class="campo">

            <label for="tipo-usuario" class="etiqueta">Tipo de Usuario</label>
            <select id="tipo-usuario" name="tipo-usuario" class="campo" required>
                <option value="">Seleccione un perfil</option>
                <option value="administrador">Administrador</option>
                <option value="cliente">Cliente</option>
                <option value="vendedor">Vendedor</option>
            </select>

            <select id="region" name="region" class="campo" required>
                <option value="">Seleccione una región</option>
            </select>

            <label for="comuna" class="etiqueta">Comuna</label>
            <select id="comuna" name="comuna" class="campo" required disabled>
            <option value="">Seleccione una comuna</option>
            </select>


            <label for="direccion" class="etiqueta">Dirección</label>
            <input type="text" class="campo" id="direccion" name="direccion" maxlength="300" required>

            <button type="submit" class="boton">Registrar usuario</button>

            <p id="confirmacion"></p>
        </form>
    </main>
</body>
