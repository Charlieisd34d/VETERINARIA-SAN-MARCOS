                    <a class="enlace-menu" href="admin-listado-productos.html">
                        <i class="bi bi-box-seam"></i> Productos

                <li class="item-menu">
                    <a class="enlace-menu" href="pedidos.html">

        <footer class="pie-barra-lateral">
            <a class="enlace-manu" href="perfil.html">
                <i class="bi bi-person-circle"></i> Perfil
            </a>
        </footer>
    </aside>

    <main class="principal">

        <header class="cabecera">
            <h1>Registro de Producto</h1>
        </header>

        <section>
            <form class="tarjeta-formulario">

                <label for="codigo-producto" class="etiqueta">Codigo Producto</label>
                <input type="text" id="codigo-producto" class="campo" required>

                <label for="nombre" class="etiqueta">Nombre</label>
                <input type="text" id="nombre" class="campo" required>

                <label for="descripcion" class="etiqueta">Descripción</label>
                <input type="text" class="campo" name="descripcion">

                <label for="precio" class="etiqueta">Precio</label>
                <input type="number" id="precio" name="precio" class="campo" min="0">

                <label for="stock" class="etiqueta">Stock</label>
                <input type="number" id="stock" name="stock" min="0" class="campo" required>

                <div class="alerta" id="alerta-stock">
                    <p>
                        El stock es inferior o igual a 0
                    </p>
                </div>

                <label for="categoria" class="etiqueta">Seleccione la categoria</label>
                <select name="categoria" id="categoria" class="campo">
                    <option value="valor1">Elige una opción</option>
                    <option value="valor2">Farmacia</option>
                    <option value="valor3">Alimentación</option>
                    <option value="valor4">Higiene</option>
                    <option value="valor5">Accesorios y Bienestar</option>
                </select>

                <button type="submit" class="boton">Enviar</button>
                <p id="confirmacion"></p>
            </form>
        </section>
    </main>
</body>
