<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Contacto</title>
    <link rel="stylesheet" href="styles.css">
    <script src="funciones.js" defer></script>
</head>
<body>

    <header class="encabezado-principal">
        <a href="pagina-principal.html" class="logo">
            <span class="icono-logo" aria-hidden="true">■</span>
            <strong>Veterinaria San Marcos</strong>
        </a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a href="pagina-principal.html">Home</a> |
            <a href="productos.html">Productos</a> |
            <a href="blogs.html">Blogs</a> |
            <a href="contacto.html">Contacto</a> |
            <a href="inicio-sesion.html">Iniciar Sesión</a>
        </nav>
        <aside class="icono-carrito">
            <a href="carrito.html" style="text-decoration: none; color: inherit;">🛒 Carrito (0)</a>
        </aside>
    </header>

    <main>
        <section id="contacto">
            <figure class="company-logo-placeholder">
                <span class="x-box" aria-hidden="true"></span>
            </figure>

            <h1 class="company-title">Veterinaria San Marcos</h1>

            <h2>Formulario de contactos</h2>

            <form id="contactForm" novalidate>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="contenido">Contenido</label>
                <textarea id="contenido" name="contenido" rows="4" required></textarea>

                <button type="submit">Enviar mensaje</button>
                <p id="mensaje-estado" aria-live="polite"></p>
            </form>
        </section>
    </main>

</body>
</html>
