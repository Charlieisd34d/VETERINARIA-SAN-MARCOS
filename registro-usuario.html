<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Registro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="funciones.js" defer></script>
</head>
<body>

    <header class="encabezado-principal">
        <a href="pagina-principal.html" class="logo">
            <span class="icono-logo" aria-hidden="true">■</span>
            <strong>Veterinaria San Marcos</strong>
        </a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a href="pagina-principal.html">Home</a> |
            <a href="productos.html">Productos</a> |
            <a href="blogs.html">Blogs</a> |
            <a href="contacto.html">Contacto</a> |
            <a href="inicio-sesion.html">Iniciar Sesión</a>
        </nav>
        <aside class="icono-carrito">
            <a href="carrito.html" style="text-decoration: none; color: inherit;">🛒 Carrito (0)</a>
        </aside>
    </header>

    <main>
        <section id="registro">
            <h2>Registro de usuario</h2>
            
            <form id="form-registro" novalidate>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="confirmar-correo">Confirmar correo electrónico</label>
                <input type="email" id="confirmar-correo" name="confirmar-correo" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>

                <label for="confirmar-password">Confirmar contraseña</label>
                <input type="password" id="confirmar-password" name="confirmar-password" required>

                <label for="telefono">Teléfono (opcional)</label>
                <input type="tel" id="telefono" name="telefono">

                <fieldset class="grupo-region-comuna">
                    <legend class="sr-only">Ubicación</legend>
                    <select id="region" name="region" required>
                        <option value="">-- Seleccione la región --</option>
                    </select>

                    <select id="comuna" name="comuna" required>
                        <option value="">-- Seleccione la comuna --</option>
                    </select>
                </fieldset>

                <button type="submit">Registrar</button>
                <p id="mensaje-estado" aria-live="polite"></p>
            </form>
        </section>
    </main>

</body>
</html>
