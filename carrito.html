<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria San Marcos - Carrito de Compras</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funciones.js" defer></script>
</head>
<body class="publico">

  <header class="cabezera-principal">
    <a href="index.html" class="logo">
      <span class="icono-cuadrado">■</span>
      <strong>Veterinaria San Marcos</strong>
    </a>
    <nav class="nav-principal">
      <a href="index.html">Home</a> |
      <a href="productos.html">Productos</a> |
      <a href="blogs.html">Blogs</a> |
      <a href="contacto.html">Contacto</a>
    </nav>
    <aside class="icono-carrito">
      <a href="carrito.html">🛒 Carrito (0)</a>
    </aside>
  </header>

  <div class="main-container">

    <div class="auth-links">
      <a href="inicio-sesion.html">Iniciar sesión</a> | <a href="registro-usuario.html">Registrar usuario</a>
    </div>

    <section class="featured-products">
      <h2 class="section-subtitle">Tu Carrito de Compras</h2>

      <!-- El script js/funciones.js renderizará dinámicamente los productos aquí -->
      <div class="products-grid carrito-lista"></div>

      <div class="hero-banner" style="margin-top: 2rem; grid-template-columns: 1fr;">
        <div class="hero-content">
          <h3>Total a pagar: <span class="monto-total">$0</span></h3>
          <p>Procesa tu compra de forma rápida y segura.</p>
          <button class="btn-hero" onclick="procesarPago()" style="border:none; cursor:pointer;">Pagar Ahora</button>
        </div>
      </div>
    </section>

  </div>

  <footer class="pie-pagina">
    <div class="footer-center" style="margin-bottom: 0.5rem;">
      <a href="productos.html?categoria=Consultas">Consultas</a> |
      <a href="productos.html?categoria=Vacunas">Vacunación</a> |
      <a href="productos.html?categoria=Farmacia">Farmacia</a>
    </div>
    <p>&copy; 2026 Veterinaria San Marcos. Todos los derechos reservados.</p>
  </footer>

</html>
