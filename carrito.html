<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria San Marcos - Carrito de Compras</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/funciones.js" defer></script>
</head>
<body>

  <header>
    <h1>Veterinaria San Marcos</h1>
    <nav>
      <a href="pagina-principal.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="carrito.html" class="activo">Carrito (1)</a>
      <a href="inicio-sesion.html">Iniciar Sesión</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Mi carrito de compras</h2>

      <!-- Contenedor Principal (Simula las 2 columnas del Mockup Figura 15) -->
      <div class="carrito-contenedor">
        
        <!-- Columna 1: Lista de Productos en el Carrito -->
        <div class="carrito-lista">
          <article class="carrito-item">
            <img src="img/producto1.jpg" alt="Consulta General" width="100">
            <div>
              <h3>Consulta General</h3>
              <p>Evaluación médica preventiva o de control para perro o gato.</p>
            </div>
            <p><strong>$15.000 CLP</strong></p>
            <div class="cantidad-control">
              <button type="button">-</button>
              <span>1</span>
              <button type="button">+</button>
            </div>
          </article>
        </div>

        <!-- Columna 2: Resumen del Pedido / Cupón / Pagar -->
        <aside class="carrito-resumen">
          <h3>TOTAL: $15.000 CLP</h3>
          
          <div class="cupon-section">
            <label for="cupon">Ingrese el cupón de descuento:</label>
            <input type="text" id="cupon" name="cupon" placeholder="Ej: DESCUENTO10">
            <button type="button">APLICAR</button>
          </div>

          <a href="pagina-principal.html" class="btn-pagar">PAGAR</a>
        </aside>

      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Veterinaria San Marcos - Rancagua, Chile.</p>
  </footer>

</body>
</html>
