                    <a class="enlace-menu" href="pedidos.html">

            <a class="perfil" href="perfil.html">
                <i class="bi bi-person-circle"></i> Perfil
            </a>
        </footer>
    </aside>

    <main class="principal">

        <header class="cabecera">
            <h1 class="titulo">Registro de Producto</h1>
        </header>

        <form class="tarjeta-formulario" id="formulario-producto">

            <label for="codigo-producto" class="etiqueta">Codigo Producto</label>
          <input type="text" id="codigo-producto" name="codigo-producto" class="campo" minlength="3" maxlength="15" required>

            <label for="nombre" class="etiqueta">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="campo" maxlength="100" required>

            <label for="descripcion" class="etiqueta">Descripción</label>
           <textarea class="campo" id="descripcion" name="descripcion" maxlength="500"></textarea>

            <label for="precio" class="etiqueta">Precio</label>
           <input type="number" id="precio" name="precio" class="campo" min="0" step="any" required>

            <label for="stock" class="etiqueta">Stock</label>
            <input type="number" id="stock" name="stock" min="0" class="campo" required>

            <div class="alerta" id="alerta-stock">
                <p>
                    El stock debe ser mayor que 0.
                </p>
            </div>

            <label for="imagen" class="etiqueta">Imagen</label>
            <input type="file" id="imagen" name="imagen" class="campo" accept="image/*">

            <label for="categoria" class="etiqueta">Seleccione la categoria</label>
            <select name="categoria" id="categoria" class="campo" required>
                <option value="">Elige una opción</option>
                <option value="farmacia">Farmacia</option>
                <option value="alimentacion">Alimentación</option>
                <option value="higiene">Higiene</option>
                <option value="accesorios-bienestar">Accesorios y Bienestar</option>
            </select>

            <button type="submit" class="boton">Registrar Producto</button>
            <p id="confirmacion"></p>
        </form>
    </main>
</body>
